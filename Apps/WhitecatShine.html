<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whitecat Shine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2a1a22;
    --panel:#3a2531;
    --panel-2:#452c3a;
    --gold:#d99cae;
    --gold-dim:#8f5c6b;
    --teal:#c98aa0;
    --text:#f3e6ea;
    --muted:#a58891;
    --border:rgba(255,220,230,0.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:72px 24px 96px;
    position:relative;
    overflow-x:hidden;
  }
  .watermark{
    position:fixed;
    bottom:-20px;
    width:220px;
    max-width:38vw;
    opacity:0.16;
    mix-blend-mode:screen;
    pointer-events:none;
    user-select:none;
    z-index:0;
  }
  .watermark.left{left:-20px;}
  .watermark.right{right:-20px;width:280px;}
  .wrap{max-width:860px;margin:0 auto;position:relative;z-index:1;}
  header{margin-bottom:48px;text-align:center;}
  h1{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:clamp(2.8rem,7vw,4.4rem);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  header p{color:var(--muted);font-size:0.98rem;margin:0;}

  .menu{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:48px;
  }
  @media (max-width:1279px){
    .menu{grid-template-columns:repeat(2, 1fr);gap:24px;max-width:880px;margin:0 auto;}
  }
  @media (max-width:699px){
    .menu{grid-template-columns:1fr;gap:20px;}
  }
  .menu li{display:flex;}

  .card{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    min-height:150px;
    padding:24px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    color:inherit;
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  a.card:hover{border-color:var(--gold-dim);background:var(--panel-2);}
  a.card:active{transform:scale(0.98);}
  a.card:focus-visible{outline:2px solid var(--teal);outline-offset:3px;}

  .card h2{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .card p{
    margin:0;
    color:var(--muted);
    font-size:0.92rem;
    line-height:1.6;
  }

  /* app non ancora pronta */
  .card.soon{
    background:transparent;
    border-style:dashed;
    cursor:default;
  }
  .card.soon h2{color:var(--muted);}

  footer{
    margin-top:40px;
    text-align:center;
    color:var(--gold-dim);
    font-size:0.85rem;
  }

  /* entrata: titolo, poi le card a cascata, poi i watermark */
  @keyframes rise{
    from{opacity:0;transform:translateY(22px) scale(.96);}
    to{opacity:1;transform:none;}
  }
  @keyframes pop-title{
    0%{opacity:0;transform:translateY(-28px) scale(.9);}
    60%{opacity:1;transform:translateY(4px) scale(1.02);}
    100%{opacity:1;transform:none;}
  }
  @keyframes wm-in{
    from{opacity:0;transform:translateY(40px);}
    to{opacity:.16;transform:none;}
  }
  h1{animation:pop-title .7s cubic-bezier(.2,.8,.3,1) both;}
  header p{animation:rise .5s ease .25s both;}
  .menu li{animation:rise .55s cubic-bezier(.2,.8,.3,1) both;}
  .menu li:nth-child(1){animation-delay:.4s;}
  .menu li:nth-child(2){animation-delay:.52s;}
  .menu li:nth-child(3){animation-delay:.64s;}
  .menu li:nth-child(4){animation-delay:.76s;}
  .menu li:nth-child(5){animation-delay:.88s;}
  .menu li:nth-child(6){animation-delay:1s;}
  footer{animation:rise .5s ease 1s both;}
  .watermark{animation:wm-in 1.2s ease .6s both;}

  @media (prefers-reduced-motion:reduce){
    .card{transition:none;}
    h1,header p,.menu li,footer,.watermark{animation:none;}
  }
  .sec{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px;}
  .sec h2{font:600 1.35rem 'Fredoka',sans-serif;margin:0 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sec h2 small{font:400 .78rem 'Inter',sans-serif;color:var(--muted);}
  .muted{color:var(--muted);font-size:.92rem;margin:0;line-height:1.6;}
  .rank{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .rank img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid var(--border);}
  .rank b{display:block;font:600 2.8rem/1 'Fredoka',sans-serif;}
  .rank span{color:var(--muted);font-size:.9rem;}
  .play{display:flex;align-items:center;gap:14px;padding:10px;margin-bottom:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;color:inherit;text-decoration:none;}
  .play:last-child{margin-bottom:0;}
  a.play:hover{border-color:var(--gold-dim);}
  .play img,.play .nocover{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--panel);}
  .play .t{flex:1;min-width:0;}
  .play .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .play .t span{color:var(--muted);font-size:.82rem;}
  .play .pp{text-align:right;font:500 1.05rem 'IBM Plex Mono',monospace;color:#f0b94a;}
  .play .pp i{display:block;font:400 .72rem 'IBM Plex Mono',monospace;color:var(--muted);font-style:normal;}
  .embed{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;}
  .embed iframe{width:100%;height:100%;border:0;display:block;}
  .live{font:600 .7rem 'Inter',sans-serif;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#c24a63;color:#fff;}
  .sinfo{margin-top:12px;}
  .sinfo a{color:var(--gold);}
  #cat{height:360px;}
  .chartbox{position:relative;margin-top:18px;}
  .rchart{width:100%;height:auto;display:block;touch-action:pan-y;}
  .rchart text{fill:var(--muted);font:11px 'IBM Plex Mono',monospace;}
  .rchart .g{stroke:var(--border);stroke-width:1;}
  .rchart .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .rchart .dot{fill:var(--gold);stroke:var(--panel);stroke-width:2;}
  .tip{position:absolute;transform:translate(-50%,-150%);pointer-events:none;padding:4px 8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);font:500 .75rem 'IBM Plex Mono',monospace;white-space:nowrap;}
  model-viewer{display:block;width:100%;height:280px;margin-top:2px;border-radius:10px;background:rgba(0,0,0,.18);cursor:pointer;--poster-color:transparent;--progress-bar-color:var(--gold);}
  .card .hint{font-size:.78rem;color:var(--gold-dim);}
  .home-btn{position:absolute;top:16px;left:16px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-weight:500;font-size:.9rem;text-decoration:none;transition:border-color .15s ease,transform .1s ease;}
  .home-btn:hover{border-color:var(--gold-dim);}
  .home-btn:active{transform:scale(.97);}
  .home-btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px;}
  .home-btn svg{width:16px;height:16px;stroke:var(--gold);}
</style>

// Global rank over the last 90 days, drawn like osu!'s: better (lower) rank is higher up
function rankChart(h){
  const pts=(h||[]).map((v,i)=>[i,v]).filter(p=>p[1]>0);
  if(pts.length<2)return null;
  const n=h.length-1,W=700,H=190,L=62,R=10,T=14,B=26,ys=pts.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),span=Math.max(1,mx-mn);
  const X=i=>L+i/n*(W-L-R),Y=v=>T+(v-mn)/span*(H-T-B);
  const NS='http://www.w3.org/2000/svg',s=(tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e};
  const svg=s('svg',{viewBox:'0 0 '+W+' '+H,class:'rchart',role:'img','aria-label':'Global rank, last 90 days'});
  [0,.5,1].forEach(f=>{const y=T+f*(H-T-B);svg.append(s('line',{x1:L,x2:W-R,y1:y,y2:y,class:'g'}));
    const t=s('text',{x:L-8,y:y+4,'text-anchor':'end'});t.textContent='#'+Math.round(mn+f*span).toLocaleString();svg.append(t)});
  const d=pts.map((p,k)=>(k&&p[0]-pts[k-1][0]===1?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  svg.append(s('path',{d,class:'ln'}));
  [['start',L,n+' days ago'],['end',W-R,'today']].forEach(([a,x,txt])=>{const t=s('text',{x,y:H-6,'text-anchor':a});t.textContent=txt;svg.append(t)});
  const box=el('div','chartbox'),tip=el('div','tip'),dot=s('circle',{r:4,class:'dot'});
  tip.hidden=true;dot.style.display='none';svg.append(dot);
  svg.addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n,Math.round((x-L)/(W-L-R)*n)));
    const p=pts.reduce((a,b)=>Math.abs(b[0]-i)<Math.abs(a[0]-i)?b:a);
    dot.setAttribute('cx',X(p[0]));dot.setAttribute('cy',Y(p[1]));dot.style.display='';
    tip.hidden=false;tip.textContent='#'+p[1].toLocaleString()+' · '+new Date(Date.now()-(n-p[0])*864e5).toLocaleDateString([],{month:'short',day:'numeric'});
    tip.style.left=(X(p[0])/W*100)+'%';tip.style.top=(Y(p[1])/H*100)+'%'});
  svg.addEventListener('pointerleave',()=>{dot.style.display='none';tip.hidden=true});
  box.append(svg,tip);return box;
}
function showRank(o){
  const box=el('div','rank');
  if(safe(o.avatar)){const i=el('img');i.src=o.avatar;i.alt='';box.append(i)}
  const d=el('div');d.append(el('b',null,o.rank?'#'+o.rank.toLocaleString():'Unranked'),
    el('span',null,[o.pp?Math.round(o.pp).toLocaleString()+'pp':'',o.countryRank?o.country+' #'+o.countryRank.toLocaleString():''].filter(Boolean).join(' · ')));
  box.append(d);const all=el('div');all.append(box);const c=rankChart(o.rankHistory);if(c)all.append(c);$('rank').replaceChildren(all);
}
function showPlays(d){
  $('win').textContent=d.window?when(d.window.from)+' to '+when(d.window.to)+(d.window.src==='best'?' (from his top plays)':''):'';
  if(!d.plays||!d.plays.length)return note('plays','No plays found for that window.');
  $('plays').replaceChildren(...d.plays.map(s=>{
    const a=el('a','play');a.href=safe(s.url)||'#';a.target='_blank';a.rel='noopener';
    if(safe(s.cover)){const i=el('img');i.src=s.cover;i.alt='';a.append(i)}else a.append(el('div','nocover'));
    const t=el('div','t');t.append(el('b',null,s.title),el('span',null,s.artist+' · ['+s.diff+']'+(s.mods?' +'+s.mods:'')));
    const pp=el('div','pp',Math.round(s.pp)+'pp');pp.append(el('i',null,s.acc.toFixed(2)+'% · '+s.grade));
    a.append(t,pp);return a}));
}
function showStream(t){
  if(!t)return note('stream','No stream found.');
  $('sTitle').replaceChildren('Whitecat on Twitch');
  $('sTitle').textContent=t.live?'Live now':'Last stream';
  if(t.live)$('sTitle').append(el('span','live','LIVE'));
  const link=t.live||!t.id?'https://www.twitch.tv/'+t.channel:'https://www.twitch.tv/videos/'+t.id;
  const box=el('div');
  if(location.hostname&&(t.live||t.id)){   // Twitch embeds need a real domain as "parent"
    const f=el('div','embed'),i=el('iframe');
    i.src='https://player.twitch.tv/?'+(t.live?'channel='+encodeURIComponent(t.channel):'video=v'+encodeURIComponent(t.id))+'&parent='+location.hostname+'&autoplay=false&muted=true';
    i.allowFullscreen=true;i.title='Twitch stream';f.append(i);box.append(f);
  }
  const info=el('p','muted sinfo');info.append((t.title||'')+(t.game?' · '+t.game:'')+' ');
  const a=el('a',null,'Open on Twitch');a.href=link;a.target='_blank';a.rel='noopener';info.append(a);
  box.append(info);$('stream').replaceChildren(box);
}
(async()=>{
  ['rank','plays','stream'].forEach(i=>note(i,'Loading…'));
  try{
    if(API.includes('YOURNAME'))throw new Error('setup');
    const r=await fetch(API);if(!r.ok)throw new Error(r.status);
    const d=await r.json();showRank(d.osu||{});showPlays(d);showStream(d.twitch);
  }catch(e){
    const m=e.message==='setup'?'Not connected yet: deploy the Worker and paste its URL into API in this page’s script.':'Couldn’t load the data.';
    ['rank','plays','stream'].forEach(i=>note(i,m));
  }
})();

// clicking (not dragging) the cat = sound at the SFX volume
const sfx=u=>window.SITE?SITE.playSfx(u):new Audio(u).play().catch(()=>{});
const cat=$('cat');let down=null;
cat.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cat.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<6)sfx('../assets/WAS.mp3');down=null});
</script>
